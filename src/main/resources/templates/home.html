<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Home ー OpenForms</title>
    <link rel="icon" href="/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #FFF8F2;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 16px 32px;
            border-bottom: 1px solid #00000025;
        }

        h1 {
            margin-top: 8px;
            font-size: 2rem;
            font-weight: bold;
        }

        .popup-background {
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0000008f;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-window {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 32px;
            background-color: #fff8f2;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
        }

        .popup-window p {
            font-weight: 300;
        }

        .popup-actions button {
            padding: 12px 16px;
        }

        .messages-container {
            display: flex;
            flex-direction: column;
            background-color: #FFF8F2;
            height: calc(100vh - 80px);
            width: min-content;
            margin-left: 64px;
            border-left: 1px solid #00000025;
            border-right: 1px solid #00000025;
            overflow-y: auto;
        }

        .home-interface {
            display: flex;
            flex-direction: row;
        }

        .form-display-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #FFF8F2;
            height: calc(100vh - 80px);
            width: min-content;
            flex-grow: 1;
            overflow-y: auto;
        }

        .form-display-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #FFF8F2;
            height: calc(100vh - 80px);
            width: min-content;
            flex-grow: 1;
            overflow-y: auto;
        }

        .form-displayer {
            display: none;
            width: 100%;
            height: 100%;
        }

        .form-info-container {
            background-color: #D9D9D9;
            width: 90%;
            height: min-content;
            margin: 5px;
            padding: 24px;
            border-radius: 10px;
        }

        .notice {
            text-align: center;
        }

        .messages-container::after {
            content: "";
            height: 240px;
            flex-shrink: 0;
        }

        .form-entry {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
            -webkit-box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 72px;
            width: 25vw;
            background-color: #D9D9D9;
            border-radius: 10px;
            margin: 5px;
            transition: opacity 100ms;
            border: 3px solid transparent;
            flex-shrink: 0;
            padding: 8px;
        }

        .form-entry:hover {
            opacity: 0.7;
            cursor: pointer;
        }

        .form-entry-top {
            display: flex;
            justify-content: space-between;
        }

        .ellipsis {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .form-entry-bottom {
            margin-right: 8px;
            margin-top: 8px
        }

        .not-viewed-entry {
            background-color: #c5cbed;
        }

        @media (max-width: 800px) {
            .messages-container {
                width: 100%;
                margin-left: 0;
                padding-left: 5px;
            }

            .form-entry {
                margin: 5px 0;
                width: 98%;
            }

            .form-display-area {
                display: none;
            }
        }
    </style>
</head>

<body>

<header>
    <img src="/assets/small_name.png" width="164" alt="OpenForms"/>
</header>

<div class="home-interface">
    <div id="messages-container" class="messages-container">
        <div class="form-entry"
             th:each="item : ${forms}"
             th:attr="
                    data-id=${item.getId()},
                    data-name=${item.getName()},
                    data-phone=${item.getPhoneNumber()},
                    data-email=${item.getEmail()},
                    data-message=${item.getMessage()},
                    data-created=${item.getCreatedAt().getTime()}
                 "
             th:classappend="${item.getVisualized() ? '' : 'not-viewed-entry'}"
        >
            <div class="form-entry-top">
                <p th:text="${item.getName()}" class="black ellipsis"></p>
                <p id="created-at">01/01/1970</p>
            </div>
            <div class="form-entry-bottom">
                <p th:text="${item.getMessage()}" class="ellipsis"></p>
            </div>
        </div>
    </div>

    <div id="form-display-area" class="form-display-area">
        <div id="form-displayer" class="form-displayer">
            <div class="form-info-container">
                <p><b>Enviado em:</b> <span id="d-created"></span></p>
                <p><b>Nome:</b> <span id="d-name"></span></p>
                <p><b>Telefone:</b> <span id="d-phone"></span></p>
                <p><b>Email:</b> <span id="d-email"></span></p>
                <p><b>Mensagem:</b> <span id="d-message"></span></p>

                <div class="popup-actions">
                    <button id="d-email-btn">Responder por Email</button>
                    <button id="d-wa-btn">Responder pelo Whatsapp</button>
                </div>
            </div>
        </div>

        <div id="notice" class="notice">
            <img src="/assets/form.svg" alt="Ícone de formulário" height="128"/>
            <h1>Nenhum formulário selecionado</h1>
            <p>Ao clicar em um dos formulários à esquerda eles aparecerão aqui</p>
        </div>
    </div>
</div>

<div id="popup" class="popup-background">
    <div class="popup-window" onclick="event.stopPropagation()">
        <p><b>Enviado em:</b> <span id="p-created"></span></p>
        <p><b>Nome:</b> <span id="p-name"></span></p>
        <p><b>Telefone:</b> <span id="p-phone"></span></p>
        <p><b>Email:</b> <span id="p-email"></span></p>
        <p><b>Mensagem:</b> <span id="p-message"></span></p>

        <div class="popup-actions">
            <button id="email-btn">Responder por Email</button>
            <button id="wa-btn">Responder pelo Whatsapp</button>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        const $popup = $("#popup");
        $popup.hide();

        async function openPopup(data) {
            try {
                await fetch(`/api/v1/form/visualize/${data.id}`, {method: "GET"});
            } catch (err) {
                console.error("Failed to visualize the form:", err);
            }

            $("#p-created").text(data.created);
            $("#p-name").text(data.name);
            $("#p-phone").text(data.phone);
            $("#p-email").text(data.email);
            $("#p-message").text(data.message);

            $("#email-btn").off("click").on("click", function () {
                window.open(`mailto://${data.email}`);
            });

            $("#wa-btn").off("click").on("click", function () {
                window.open(`https://wa.me/${data.email}`);
            });

            $popup.fadeIn(150);
        }

        async function setDisplayer(data) {
            try {
                await fetch(`/api/v1/form/visualize/${data.id}`, {method: "GET"});
            } catch (err) {
                console.error("Failed to visualize the form:", err);
            }

            $("#d-created").text(data.created);
            $("#d-name").text(data.name);
            $("#d-phone").text(data.phone);
            $("#d-email").text(data.email);
            $("#d-message").text(data.message);

            $("#d-email-btn").off("click").on("click", function () {
                window.open(`mailto://${data.email}`);
            });

            $("#d-wa-btn").off("click").on("click", function () {
                window.open(`https://wa.me/${data.email}`);
            });

            const $formDisplayArea = $("#form-display-area");

            $formDisplayArea.children("#notice").hide()
            $formDisplayArea.children("#form-displayer").fadeIn(150)
        }

        function closePopup() {
            $popup.fadeOut(150);
        }

        $popup.on("click", function () {
            closePopup();
        });

        $(".popup-window").on("click", function (e) {
            e.stopPropagation();
        });

        $(document).on("click", ".form-entry", function () {
            const $row = $(this);

            if ($(document).width() <= 864) {
                $row.removeClass("not-viewed-entry")
                openPopup({
                    id: $row.attr("data-id"),
                    name: $row.attr("data-name"),
                    phone: $row.attr("data-phone"),
                    email: $row.attr("data-email"),
                    message: $row.attr("data-message"),
                    created: $row.attr("data-created"),
                });
            } else {
                $row.removeClass("not-viewed-entry")
                setDisplayer({
                    id: $row.attr("data-id"),
                    name: $row.attr("data-name"),
                    phone: $row.attr("data-phone"),
                    email: $row.attr("data-email"),
                    message: $row.attr("data-message"),
                    created: $row.attr("data-created"),
                })
            }
        });

        $(".form-entry").each(function () {
            const $row = $(this);
            const $dataMilis = parseInt($row.attr("data-created"));

            console.log($dataMilis)

            const date = new Date($dataMilis);

            const formattedDate = date.toLocaleString("pt-BR", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
            })

            $($row).children(".form-entry-top").children("#created-at").text(formattedDate)
        })
    });
</script>

</body>
</html>
