<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Home ー OpenForms</title>
    <link rel="icon" href="/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #FFF8F2;
        }

        header {
            width: 100%;
            padding: 16px 32px;
            border-bottom: 1px solid #00000025;
        }

        .content {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding: 0px 128px;
            margin-top: 32px;
            margin-bottom: 64px;
        }

        .small-company-name {
            font-size: 1rem;
            font-weight: 300;
        }

        h1 {
            margin-top: 8px;
            font-size: 2rem;
            font-weight: bold;
        }

        .description {
            margin-top: 4px;
            margin-bottom: 32px;
            font-size: 1rem;
        }

        @media (max-width: 1000px) {
            .content {
                width: 92%;
                padding: 0px 32px;
            }
        }

        @media (max-width: 645px) {
            .content {
                width: 93vw;
                padding: 0px 16px;
            }
        }

        .table-container {
            display: flex;
            flex-direction: column;
            width: 80%;
        }

        @media (max-width: 1000px) {
            .table-container {
                width: 100%;
            }
        }

        @media (max-width: 645px) {
            .table-container {
                flex-direction: column-reverse;
            }

            .table-line {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                padding: 12px;
                background: #f9f9f9;
                border-radius: 10px;
            }
        }

        .table-line {
            display: flex;
            align-items: center;
        }

        .table-content:hover {
            opacity: 0.85;
            cursor: pointer;
        }

        .cell {
            display: flex;
            background-color: #d9d9d9;
            padding: 16px 8px;
            width: 320px;
            border: 1.5px solid #00000025;
        }

        .content-cell {
            background-color: #fff8f2;
        }

        .popup-background {
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0000008f;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-window {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 32px;
            background-color: #fff8f2;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
        }

        .popup-window p {
            font-weight: 300;
        }

        .popup-actions {
            display: flex;
            gap: 32px;
            justify-content: center;
            margin-top: 32px;
        }

        .popup-actions button {
            padding: 12px 16px;
        }

        .non-visualized-line > .content-cell {
            background-color: #FFFF7E;
        }
    </style>
</head>

<body>

<header>
    <img src="/assets/small_name.png" width="164" alt="OpenForms"/>
</header>

<div class="content">
    <p class="small-company-name" th:text="${companyName}"></p>
    <h1>Mensagens para sua empresa</h1>
    <p class="description">
        Clique em uma mensagem para ver todas as informações.<br/>
        Mensagens não lidas aparecem destacadas.
    </p>

    <div class="table-container">
        <div>
            <div class="table-line">
                <div class="cell"><p>Nome</p></div>
                <div class="cell"><p>Telefone</p></div>
                <div class="cell"><p>Email</p></div>
                <div class="cell"><p>Mensagem</p></div>
            </div>

            <div class="table-line table-content"
                 th:each="item : ${forms}"
                 th:attr="
                    data-id=${item.getId()},
                    data-name=${item.getName()},
                    data-phone=${item.getPhoneNumber()},
                    data-email=${item.getEmail()},
                    data-message=${item.getMessage()},
                    data-created=${item.getCreatedAt()}
                 "
                 th:classappend="${item.getVisualized()} ? '' : 'non-visualized-line'"
            >

                <div class="cell content-cell">
                    <p th:text="${item.getName()}"></p>
                </div>
                <div class="cell content-cell">
                    <p th:text="${item.getPhoneNumber()}"></p>
                </div>
                <div class="cell content-cell">
                    <p th:text="${item.getEmail()}"></p>
                </div>
                <div class="cell content-cell">
                    <p th:text="${item.getMessage()}"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="popup" class="popup-background">
    <div class="popup-window" onclick="event.stopPropagation()">
        <p><b>Enviado em:</b> <span id="p-created"></span></p>
        <p><b>Nome:</b> <span id="p-name"></span></p>
        <p><b>Telefone:</b> <span id="p-phone"></span></p>
        <p><b>Email:</b> <span id="p-email"></span></p>
        <p><b>Mensagem:</b> <span id="p-message"></span></p>

        <div class="popup-actions">
            <button id="email-btn">Responder por Email</button>
            <button id="wa-btn">Responder pelo Whatsapp</button>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        const $popup = $("#popup");
        $popup.hide()

        async function openPopup(data) {
            try {
                await fetch(`/api/v1/form/visualize/${data.id}`, { method: "GET" });
            } catch (err) {
                console.error("Failed to visualize the form:", err);
            }

            $("#p-created").text(data.created);
            $("#p-name").text(data.name);
            $("#p-phone").text(data.phone);
            $("#p-email").text(data.email);
            $("#p-message").text(data.message);

            $("#email-btn").off("click").on("click", function () {
                window.open(`mailto://${data.email}`);
            });

            $("#wa-btn").off("click").on("click", function () {
                window.open(`https://wa.me/${data.email}`);
            });

            $popup.fadeIn(150);
        }

        function closePopup() {
            $popup.fadeOut(150);
        }

        $popup.on("click", function () {
            closePopup();
        });

        $(".popup-window").on("click", function (e) {
            e.stopPropagation();
        });

        $(document).on("click", ".table-content", function () {
            const $row = $(this);
            $row.removeClass("non-visualized-line")
            openPopup({
                id: $row.attr("data-id"),
                name: $row.attr("data-name"),
                phone: $row.attr("data-phone"),
                email: $row.attr("data-email"),
                message: $row.attr("data-message"),
                created: $row.attr("data-created"),
            });
        });
    });
</script>

</body>
</html>
